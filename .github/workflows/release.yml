name: Release Obsidian plugin
on:
    push:
        tags:
            - "*"
jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v3
            - name: Use Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "20.x"
            - name: Build plugin
              run: |
                  npm ci
                  npm run lint
                  npm run typecheck
                  npm test
                  npm run build
            - name: Generate artifact attestation
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      styles.css
                      manifest.json
            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  node -e 'const m = require("./manifest.json"); if (m.version !== process.env.GITHUB_REF_NAME || require("./package.json").version !== m.version || require("./versions.json")[m.version] !== m.minAppVersion) process.exit(1)'
                  test -s "docs/releases/$tag.md"
                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    --verify-tag \
                    --notes-file="docs/releases/$tag.md" \
                    main.js manifest.json styles.css
